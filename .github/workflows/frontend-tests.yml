name: Frontend Tests

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./bugtracker-frontend

    steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Show Date and Time
    run: date

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm
      cache-dependency-path: ./bugtracker-frontend/package-lock.json

  - name: Install dependencies
    run: npm ci

  - name: Run Frontend Unit Tests
    run: npm test

  - name: Build Frontend
    run: npm run build
